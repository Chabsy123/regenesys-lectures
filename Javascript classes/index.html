<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Regenesys</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div>
        <h3>Add Stock</h3>
        <input type="text" placeholder="Enter Stock Name" id="stockName" />
        <input type="number" placeholder="Enter Cost Price" id="costPrice" />
        <input
          type="number"
          placeholder="Enter Selling Price"
          id="sellingPrice"
        />
        <input type="number" placeholder="Enter Quantity" id="quantity" />
        <button onClick="addStock()">Add Stock</button>

        <table border="1px solid">
          <thead>
            <tr>
              <th>Item</th>
              <th>Stock</th>
              <th>Cost Price</th>
              <th>Selling Price</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="stockTable"></tbody>
        </table>
      </div>

      <hr />

      <div>
        <h3>Add Sale</h3>
        <select id="saleItem"></select>
        <input type="number" placeholder="Enter Quantity" id="saleQuantity" />
        <button onClick="addSale()">Add Sale</button>

        <table>
          <thead>
            <tr>
              <th>Item</th>
              <th>Quantity</th>
              <th>Revenue</th>
              <th>Profit</th>
            </tr>
          </thead>
          <tbody id="saleTable"></tbody>
        </table>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
